<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="160" r="145" fill="url(#avatarGlow)" />

  <!-- Outer Ring with Gradient -->
  <circle cx="160" cy="160" r="130" fill="none" stroke="url(#avatarGrad)" stroke-width="4" stroke-dasharray="6 4" opacity="0.85" />
  
  <!-- Base Profile Surface -->
  <circle cx="160" cy="160" r="118" fill="#111827" stroke="#1f2937" stroke-width="3" />

  <!-- Stylized Geometric Avatar / Code Icon -->
  <g transform="translate(160, 150) scale(1.1)">
    <!-- Head Silhouette -->
    <circle cx="0" cy="-35" r="32" fill="url(#avatarGrad)" />
    <!-- Modern Tech Shoulder/Torso -->
    <path d="M -55 35 C -55 0, -25 -10, 0 -10 C 25 -10, 55 0, 55 35 Z" fill="url(#avatarGrad)" opacity="0.9" />
    
    <!-- Code brackets accent -->
    <path d="M -40 -30 L -52 -18 L -40 -6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M 40 -30 L 52 -18 L 40 -6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Online / Active Badge -->
  <circle cx="235" cy="235" r="18" fill="#0f172a" stroke="#1e293b" stroke-width="3" />
  <circle cx="235" cy="235" r="11" fill="url(#badgeGrad)" />
  <circle cx="235" cy="235" r="11" fill="#10b981">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
