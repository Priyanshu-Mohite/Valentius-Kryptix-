<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29" />
      <stop offset="100%" stop-color="#2a0845" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" rx="16" fill="url(#bgGrad3)" />

  <!-- Window Container -->
  <rect x="24" y="24" width="592" height="352" rx="12" fill="#11071f" stroke="#4c1d95" stroke-width="1.5" />
  <rect x="24" y="24" width="592" height="40" rx="12" fill="#1f0f38" />
  <circle cx="48" cy="44" r="6" fill="#ef4444" />
  <circle cx="68" cy="44" r="6" fill="#f59e0b" />
  <circle cx="88" cy="44" r="6" fill="#10b981" />
  <rect x="200" y="34" width="240" height="20" rx="6" fill="#2d164d" />
  <text x="320" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#d8b4fe" text-anchor="middle">promptflow.ai/studio/agents</text>

  <!-- Left: Flow Graph Nodes -->
  <rect x="44" y="80" width="270" height="280" rx="8" fill="#180c2e" stroke="#3b136f" />
  <text x="60" y="104" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f3e8ff">Workflow Canvas</text>

  <!-- Node 1: Input Trigger -->
  <rect x="64" y="120" width="230" height="52" rx="8" fill="#241042" stroke="#a855f7" stroke-width="1.5" />
  <circle cx="82" cy="146" r="8" fill="#a855f7" />
  <text x="100" y="142" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">User Intent Listener</text>
  <text x="100" y="156" font-family="sans-serif" font-size="9" fill="#c084fc">Event: webhook.payload.received</text>

  <!-- Connecting Line -->
  <line x1="179" y1="172" x2="179" y2="198" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Node 2: LLM Reasoning Agent -->
  <rect x="64" y="200" width="230" height="52" rx="8" fill="#241042" stroke="#ec4899" stroke-width="1.5" />
  <circle cx="82" cy="226" r="8" fill="#ec4899" />
  <text x="100" y="222" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">LLM Reasoning Engine</text>
  <text x="100" y="236" font-family="sans-serif" font-size="9" fill="#f472b6">Gemini / Claude Hybrid Chain</text>

  <!-- Connecting Line -->
  <line x1="179" y1="252" x2="179" y2="278" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Node 3: Tool Dispatcher -->
  <rect x="64" y="280" width="230" height="52" rx="8" fill="#241042" stroke="#06b6d4" stroke-width="1.5" />
  <circle cx="82" cy="306" r="8" fill="#06b6d4" />
  <text x="100" y="302" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Multi-Tool Dispatcher</text>
  <text x="100" y="316" font-family="sans-serif" font-size="9" fill="#67e8f9">Output: Autonomous Execution</text>

  <!-- Right: Code & Streaming Output -->
  <rect x="326" y="80" width="270" height="280" rx="8" fill="#180c2e" stroke="#3b136f" />
  <rect x="326" y="80" width="270" height="30" rx="8" fill="#220e3f" />
  <text x="342" y="100" font-family="monospace" font-size="11" fill="#e9d5ff">stream_output.json</text>
  
  <text x="342" y="132" font-family="monospace" font-size="10" fill="#93c5fd">{"agent": "Kryptix-Agent-01",</text>
  <text x="342" y="148" font-family="monospace" font-size="10" fill="#93c5fd"> "status": <tspan fill="#4ade80">"synthesizing"</tspan>,</text>
  <text x="342" y="164" font-family="monospace" font-size="10" fill="#93c5fd"> "tokens_per_sec": <tspan fill="#f59e0b">112.4</tspan>,</text>
  <text x="342" y="180" font-family="monospace" font-size="10" fill="#93c5fd"> "confidence": <tspan fill="#f43f5e">0.994</tspan>}</text>

  <!-- Response preview card -->
  <rect x="338" y="206" width="246" height="138" rx="6" fill="#130824" stroke="#4c1d95" />
  <text x="350" y="228" font-family="sans-serif" font-size="10" font-weight="bold" fill="#d8b4fe">LIVE EXECUTION LOGS</text>
  <text x="350" y="250" font-family="sans-serif" font-size="9" fill="#a855f7">> Analyzing user schema...</text>
  <text x="350" y="268" font-family="sans-serif" font-size="9" fill="#a855f7">> Executing AST transformation</text>
  <text x="350" y="286" font-family="sans-serif" font-size="9" fill="#10b981">> Verified: 0 security errors</text>
  <text x="350" y="304" font-family="sans-serif" font-size="9" fill="#38bdf8">> Returning serialized artifact</text>
  <rect x="350" y="320" width="12" height="12" fill="#ec4899">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
  <text x="368" y="330" font-family="monospace" font-size="9" fill="#ec4899">Listening...</text>
</svg>
