  <!-- Background -->
  <rect width="640" height="400" rx="16" fill="url(#bgGrad2)" />
  
  <!-- Window Container -->
  <rect x="24" y="24" width="592" height="352" rx="12" fill="#0b1716" stroke="#164e63" stroke-width="1.5" />
