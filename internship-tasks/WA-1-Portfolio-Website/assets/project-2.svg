  <text x="250" y="302" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">+$1,280.00</text>

  <line x1="68" y1="322" x2="296" y2="322" stroke="#1b433e" />
  <circle cx="78" cy="342" r="10" fill="#991b1b" />
