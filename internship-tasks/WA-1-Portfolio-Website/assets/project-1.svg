<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="chartGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="640" height="400" rx="16" fill="url(#bgGrad1)" />
  
  <!-- Window Header Bar -->
  <rect x="24" y="24" width="592" height="352" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <rect x="24" y="24" width="592" height="40" rx="12" fill="#131d2e" />
  <circle cx="48" cy="44" r="6" fill="#ef4444" />
  <circle cx="68" cy="44" r="6" fill="#f59e0b" />
  <circle cx="88" cy="44" r="6" fill="#10b981" />
  <rect x="180" y="34" width="280" height="20" rx="6" fill="#1e293b" />
  <text x="320" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">app.devmetrics.io/analytics</text>

  <!-- Sidebar -->
  <rect x="40" y="80" width="120" height="280" rx="8" fill="#111c2e" />
  <rect x="52" y="96" width="96" height="12" rx="4" fill="#3b82f6" opacity="0.8" />
  <rect x="52" y="122" width="70" height="8" rx="4" fill="#475569" />
  <rect x="52" y="142" width="85" height="8" rx="4" fill="#475569" />
  <rect x="52" y="162" width="60" height="8" rx="4" fill="#475569" />
  <rect x="52" y="182" width="75" height="8" rx="4" fill="#475569" />

  <!-- Main Content Dashboard -->
  <!-- Stat Cards -->
  <rect x="176" y="80" width="130" height="64" rx="8" fill="#111c2e" stroke="#1e293b" />
  <text x="188" y="100" font-family="sans-serif" font-size="10" fill="#94a3b8">API REQUESTS</text>
  <text x="188" y="128" font-family="sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">1.42M</text>

  <rect x="318" y="80" width="130" height="64" rx="8" fill="#111c2e" stroke="#1e293b" />
  <text x="330" y="100" font-family="sans-serif" font-size="10" fill="#94a3b8">AVG LATENCY</text>
  <text x="330" y="128" font-family="sans-serif" font-size="20" font-weight="bold" fill="#10b981">14ms</text>

  <rect x="460" y="80" width="140" height="64" rx="8" fill="#111c2e" stroke="#1e293b" />
  <text x="472" y="100" font-family="sans-serif" font-size="10" fill="#94a3b8">UPTIME SLA</text>
  <text x="472" y="128" font-family="sans-serif" font-size="20" font-weight="bold" fill="#a855f7">99.99%</text>

  <!-- Big Interactive Chart Area -->
  <rect x="176" y="156" width="424" height="204" rx="8" fill="#111c2e" stroke="#1e293b" />
  <text x="194" y="180" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Throughput & Server Health</text>
  
  <!-- Grid Lines -->
  <line x1="194" y1="210" x2="580" y2="210" stroke="#1e293b" stroke-dasharray="3 3" />
  <line x1="194" y1="250" x2="580" y2="250" stroke="#1e293b" stroke-dasharray="3 3" />
  <line x1="194" y1="290" x2="580" y2="290" stroke="#1e293b" stroke-dasharray="3 3" />
  <line x1="194" y1="330" x2="580" y2="330" stroke="#1e293b" />

  <!-- Area under curve -->
  <path d="M 194 320 Q 240 280, 280 300 T 370 240 T 460 210 T 540 190 L 580 200 L 580 330 L 194 330 Z" fill="url(#chartGrad1)" />
  <!-- Curve line -->
  <path d="M 194 320 Q 240 280, 280 300 T 370 240 T 460 210 T 540 190 L 580 200" fill="none" stroke="url(#accent1)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Data Points -->
  <circle cx="370" cy="240" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
  <circle cx="460" cy="210" r="5" fill="#6366f1" stroke="#0f172a" stroke-width="2" />
  <circle cx="540" cy="190" r="5" fill="#a855f7" stroke="#0f172a" stroke-width="2" />
</svg>
